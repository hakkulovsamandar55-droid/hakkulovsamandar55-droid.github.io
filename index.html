<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Boshlang'ich title — UE5 OnTitleChanged uchun "boshlang'ich holat" -->
    <title>LAB_PENDING</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(10, 15, 20, 0.9);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 12px;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.15), inset 0 0 20px rgba(0, 210, 255, 0.1);
            text-align: center;
            width: 360px;
            transition: transform 0.3s ease, opacity 0.5s ease;
            z-index: 10;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
        }

        h2 {
            margin-bottom: 25px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            transition: transform 0.2s ease;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00d2ff;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
            background: #050a0f;
            border: 2px solid rgba(0, 210, 255, 0.5);
            border-radius: 8px;
            color: #ffffff;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
            cursor: pointer;
            letter-spacing: 1px;
        }

        input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            background: #000000;
        }

        /* === XATO HOLATI === */
        .input-group.error input {
            border-color: #ff3366;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
            animation: shake 0.4s ease;
        }

        .input-group.error label {
            color: #ff3366;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .error-message {
            color: #ff3366;
            text-align: center;
            margin: 10px 0 5px 0;
            font-size: 13px;
            min-height: 18px;
            letter-spacing: 1px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
        }

        button.submit-btn {
            width: 100%;
            padding: 16px;
            background: #00d2ff;
            border: none;
            border-radius: 8px;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button.submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            background: #33dbff;
        }

        /* --- VR KLAVIATURA --- */
        .keyboard {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 900px;
            background: #000000;
            border: 3px solid #00d2ff;
            border-bottom: none;
            box-shadow: 0 -5px 40px rgba(0, 210, 255, 0.15);
            padding: 20px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .keyboard.active {
            bottom: 0;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .key {
            padding: 16px 0;
            background: #050a0f;
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            transition: 0.1s;
            flex: 1;
            max-width: 70px;
            text-align: center;
            user-select: none;
        }

        .key:active {
            background: rgba(0, 210, 255, 0.4);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
            transform: scale(0.95);
        }

        .key.wide {
            max-width: 140px;
            font-size: 16px;
            font-weight: bold;
            color: #00d2ff;
        }

        .key.space {
            max-width: 350px;
        }

        .key.enter-key {
            background: #004b5c;
            color: #00d2ff;
            border-color: #00d2ff;
            font-weight: bold;
        }

        .key.enter-key:active {
            background: #00d2ff;
            color: #000000;
        }

        .hidden {
            display: none !important;
        }

        /* UE5 uchun yashirin status elementi (sahifada ko'rinmaydi, lekin DOM da bor) */
        #auth-status {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ================================================== -->
    <!-- UE5 UCHUN YASHIRIN STATUS ELEMENTI                 -->
    <!-- UE bu elementni o'qib auth holatini bilib oladi    -->
    <!-- ================================================== -->
    <div id="auth-status" data-status="PENDING" data-username="">PENDING</div>

    <div class="container" id="login-container">
        <div class="icon">🧪</div>
        <h2>LABORATORIYA</h2>
        <form id="labForm" autocomplete="off">
            <div class="input-group" id="login-group">
                <label for="login">Login</label>
                <input type="text" id="login" class="vr-input" placeholder="Loginni kiriting" inputmode="none">
            </div>
            <div class="input-group" id="kod-group">
                <label for="kod">Parol</label>
                <input type="password" id="kod" class="vr-input" placeholder="Parolni kiriting" inputmode="none">
            </div>
            <div class="error-message" id="error-msg"></div>
            <button type="submit" class="submit-btn">KIRISH</button>
        </form>
    </div>

    <div class="container hidden" id="success-container">
        <div class="icon">✨</div>
        <h2 style="color: #00d2ff;">Siz muvaffaqiyatli ro'yxatdan o'tdingiz.</h2>
        <p style="color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 15px;">
            Sahnaga kirilmoqda...
        </p>
    </div>

    <div class="keyboard" id="vr-keyboard">
        <div class="key-row">
            <div class="key" onclick="typeKey('1')">1</div>
            <div class="key" onclick="typeKey('2')">2</div>
            <div class="key" onclick="typeKey('3')">3</div>
            <div class="key" onclick="typeKey('4')">4</div>
            <div class="key" onclick="typeKey('5')">5</div>
            <div class="key" onclick="typeKey('6')">6</div>
            <div class="key" onclick="typeKey('7')">7</div>
            <div class="key" onclick="typeKey('8')">8</div>
            <div class="key" onclick="typeKey('9')">9</div>
            <div class="key" onclick="typeKey('0')">0</div>
        </div>
        <div class="key-row">
            <div class="key" onclick="typeKey('q')">q</div>
            <div class="key" onclick="typeKey('w')">w</div>
            <div class="key" onclick="typeKey('e')">e</div>
            <div class="key" onclick="typeKey('r')">r</div>
            <div class="key" onclick="typeKey('t')">t</div>
            <div class="key" onclick="typeKey('y')">y</div>
            <div class="key" onclick="typeKey('u')">u</div>
            <div class="key" onclick="typeKey('i')">i</div>
            <div class="key" onclick="typeKey('o')">o</div>
            <div class="key" onclick="typeKey('p')">p</div>
        </div>
        <div class="key-row">
            <div class="key" onclick="typeKey('a')">a</div>
            <div class="key" onclick="typeKey('s')">s</div>
            <div class="key" onclick="typeKey('d')">d</div>
            <div class="key" onclick="typeKey('f')">f</div>
            <div class="key" onclick="typeKey('g')">g</div>
            <div class="key" onclick="typeKey('h')">h</div>
            <div class="key" onclick="typeKey('j')">j</div>
            <div class="key" onclick="typeKey('k')">k</div>
            <div class="key" onclick="typeKey('l')">l</div>
        </div>
        <div class="key-row">
            <div class="key" onclick="typeKey('z')">z</div>
            <div class="key" onclick="typeKey('x')">x</div>
            <div class="key" onclick="typeKey('c')">c</div>
            <div class="key" onclick="typeKey('v')">v</div>
            <div class="key" onclick="typeKey('b')">b</div>
            <div class="key" onclick="typeKey('n')">n</div>
            <div class="key" onclick="typeKey('m')">m</div>
            <div class="key wide" onclick="backspace()">⌫ O'CHIRISH</div>
        </div>
        <div class="key-row">
            <div class="key wide" onclick="closeKeyboard()">YOPISH ⬇</div>
            <div class="key space" onclick="typeKey(' ')">PROBEL</div>
            <div class="key wide enter-key" onclick="submitForm()">KIRISH ↵</div>
        </div>
    </div>

    <script>
        // ================================================
        // 1. OVOZ (SFX) MANTIQI
        // ================================================
        let audioCtx = null;

        function playSound(type = 'click') {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (type === 'click') {
                // 🔲 MODERN KEY CLICK - ikkita osc + filter
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                const gain2 = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                const masterGain = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'square';
                osc1.frequency.setValueAtTime(850, audioCtx.currentTime);
                osc2.frequency.setValueAtTime(1300, audioCtx.currentTime);

                filter.type = 'highpass';
                filter.frequency.setValueAtTime(600, audioCtx.currentTime);

                gain1.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain2.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc1.connect(gain1);
                osc2.connect(gain2);
                gain1.connect(filter);
                gain2.connect(filter);
                filter.connect(masterGain);
                masterGain.connect(audioCtx.destination);
                masterGain.gain.setValueAtTime(0.14, audioCtx.currentTime);

                osc1.start(audioCtx.currentTime);
                osc2.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.08);
                osc2.stop(audioCtx.currentTime + 0.08);

            } else if (type === 'submit') {
                // ⚡ SCI-FI ACCESS GRANTED - yuqoriga ketuvchi, dinamik
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(680, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1100, audioCtx.currentTime + 0.18);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(3500, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.22);

            } else if (type === 'error') {
                // 🚨 WARNING TONE - alarmali, past frekansiya
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(280, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(160, audioCtx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.3);

            } else if (type === 'success') {
                // ✨ ACCESS GRANTED MELODIYA - 3-notli arpegggio
                const notes = [523, 659, 784]; // Do, Mi, Sol - C Major triad
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const filter = audioCtx.createBiquadFilter();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                        filter.type = 'highpass';
                        filter.frequency.setValueAtTime(450, audioCtx.currentTime);

                        gain.gain.setValueAtTime(0.13, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(audioCtx.currentTime);
                        osc.stop(audioCtx.currentTime + 0.18);
                    }, i * 90);
                });
            }
        }

        // ================================================
        // 2. KLAVIATURA MANTIQI
        // ================================================
        let activeInput = null;
        const keyboard = document.getElementById('vr-keyboard');
        const inputs = document.querySelectorAll('.vr-input');

        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                activeInput = input;
                keyboard.classList.add('active');
                playSound('click');
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('key') &&
                !e.target.classList.contains('vr-input') &&
                !e.target.closest('.keyboard') &&
                !e.target.classList.contains('submit-btn')) {
                closeKeyboard();
            }
        });

        function typeKey(char) {
            playSound('click');
            if (activeInput) {
                activeInput.value += char;
                activeInput.focus();
                // Xato holatini tozalash, foydalanuvchi yozishni boshlasa
                clearError();
            }
        }

        function backspace() {
            playSound('click');
            if (activeInput) {
                activeInput.value = activeInput.value.slice(0, -1);
                activeInput.focus();
                clearError();
            }
        }

        function closeKeyboard() {
            if (keyboard.classList.contains('active')) {
                playSound('click');
                keyboard.classList.remove('active');
            }
            activeInput = null;
        }

        // ================================================
        // 3. XATO KO'RSATISH
        // ================================================
        function showError(message) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = message;

            const loginVal = document.getElementById('login').value.trim();
            const kodVal = document.getElementById('kod').value.trim();

            if (!loginVal) document.getElementById('login-group').classList.add('error');
            if (!kodVal) document.getElementById('kod-group').classList.add('error');
        }

        function clearError() {
            document.getElementById('error-msg').textContent = '';
            document.getElementById('login-group').classList.remove('error');
            document.getElementById('kod-group').classList.remove('error');
        }

        // ================================================
        // 4. FORMA TASDIQI — VALIDATSIYA + UE5 SIGNALLARI
        // ================================================
        function submitForm() {
            const loginVal = document.getElementById('login').value.trim();
            const kodVal = document.getElementById('kod').value.trim();

            // ❗ BUG TUZATISH: Bo'sh maydonlar tekshiruvi
            if (!loginVal || !kodVal) {
                playSound('error');
                if (!loginVal && !kodVal) {
                    showError("Login va parolni kiriting!");
                } else if (!loginVal) {
                    showError("Loginni kiriting!");
                } else {
                    showError("Parolni kiriting!");
                }
                return; // To'xtatish, keyingi oynaga o'tmaydi
            }

            // Hammasi to'g'ri — autentifikatsiya muvaffaqiyatli
            playSound('submit');
            closeKeyboard();
            authenticateUser(loginVal);
        }

        // Oddiy submit tugmasi (sichqoncha bilan) ham shu yo'lni ishlatadi
        document.getElementById('labForm').addEventListener('submit', function(event) {
            event.preventDefault();
            submitForm();
        });

        // ================================================
        // 5. UNREAL ENGINE 5 INTEGRATSIYASI
        // ================================================
        // UE5 Web Browser Widget bu signallarning IXTIYORIY
        // birini (yoki bir nechtasini) tutib oladi:
        //
        //   A) document.title  →  OnTitleChanged event
        //   B) URL hash        →  OnUrlChanged event
        //   C) window.LAB_*    →  ExecuteJavascript orqali
        //   D) #auth-status    →  DOM polling
        // ================================================
        function authenticateUser(username) {
            // ---- A) TITLE O'ZGARTIRISH ----
            // UE5 da WebBrowser->OnTitleChanged event'i bu o'zgarishni ushlaydi
            document.title = 'LAB_AUTHENTICATED';

            // ---- B) URL HASH ----
            // UE5 da OnUrlChanged event'i ushlaydi.
            // URL: file:///.../vr_lab_login.html#authenticated
            window.location.hash = 'authenticated';

            // ---- C) GLOBAL JAVASCRIPT O'ZGARUVCHILARI ----
            // UE5 dan ExecuteJavascript("window.LAB_AUTH_STATUS") chaqirilsa,
            // "SUCCESS" qiymatini qaytaradi
            window.LAB_AUTH_STATUS = 'SUCCESS';
            window.LAB_USERNAME = username;
            window.LAB_AUTH_TIME = Date.now();

            // ---- D) DOM ELEMENTI YANGILASH ----
            const statusEl = document.getElementById('auth-status');
            statusEl.dataset.status = 'AUTHENTICATED';
            statusEl.dataset.username = username;
            statusEl.textContent = 'AUTHENTICATED';

            // ---- E) MAXSUS EVENT (agar UE listener qo'ygan bo'lsa) ----
            window.dispatchEvent(new CustomEvent('labAuthenticated', {
                detail: { username: username, status: 'SUCCESS' }
            }));

            // Console.log — UE log'iga ham tushadi
            console.log('[VR_LAB] AUTH_SUCCESS user=' + username);

            // Vizual o'tish
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('success-container').classList.remove('hidden');
            playSound('success');
        }

        // ================================================
        // 6. UE5 dan tashqaridan chaqirish uchun yordamchilar
        // ================================================
        // UE5 ExecuteJavascript orqali bularni chaqirishi mumkin:
        //   getLabAuthStatus()  →  hozirgi status'ni qaytaradi
        //   resetLabAuth()      →  qayta login uchun reset
        // ================================================
        window.getLabAuthStatus = function() {
            return JSON.stringify({
                status: window.LAB_AUTH_STATUS || 'PENDING',
                username: window.LAB_USERNAME || '',
                time: window.LAB_AUTH_TIME || 0
            });
        };

        window.resetLabAuth = function() {
            window.LAB_AUTH_STATUS = 'PENDING';
            window.LAB_USERNAME = '';
            document.title = 'LAB_PENDING';
            window.location.hash = '';
            const statusEl = document.getElementById('auth-status');
            statusEl.dataset.status = 'PENDING';
            statusEl.dataset.username = '';
            statusEl.textContent = 'PENDING';
            document.getElementById('success-container').classList.add('hidden');
            document.getElementById('login-container').classList.remove('hidden');
            document.getElementById('login').value = '';
            document.getElementById('kod').value = '';
            clearError();
        };
    </script>

</body>
</html>
